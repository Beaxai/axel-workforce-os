openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User directory operations
  - name: leads
    description: Lead capture and conversion operations
  - name: accounts
    description: Account directory operations
  - name: deal-card
    description: Deal card collaboration hub operations (Phase 4C)
paths:
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List users (team directory)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
  /users/invite:
    post:
      operationId: inviteUser
      tags: [users]
      summary: Invite a new user (ADMIN). Creates user + membership + profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's full profile (record-level authz)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUserProfile
      tags: [users]
      summary: Update a profile (self limited to contact fields; ADMIN full)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [users]
      summary: Activate or deactivate a user (ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
  /users/{id}/activity:
    get:
      operationId: getUserActivity
      tags: [users]
      summary: Paginated activity performed by a user (record-level authz)
      description: >-
        Server honors optional ?limit (default 25, max 100) and ?offset query
        params; they are omitted from the typed contract to avoid an
        orval path+query schema-name collision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-registrations/{id}/approve:
    post:
      operationId: approveAgentRegistration
      tags: [agent-registrations]
      summary: Approve a registration and provision an AGENT login (ADMIN/CSA)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Approved and provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveRegistrationResponse"
        "409":
          description: Already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a new user (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "409":
          description: Email already exists
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
  /leads/{id}/convert:
    post:
      operationId: convertLead
      tags: [leads]
      summary: Convert a lead into an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertLeadRequest"
      responses:
        "201":
          description: Converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertLeadResult"
        "200":
          description: Already converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertLeadResult"
  /accounts:
    get:
      operationId: getAccounts
      tags: [accounts]
      summary: List accounts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: stage
          in: query
          required: false
          schema:
            type: string
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [prospects, clients]
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Not found
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /deal-card/{id}/submission:
    get:
      operationId: getDealSubmission
      tags: [deal-card]
      summary: Sectioned submission fields + server-computed completeness
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deal submission payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealSubmissionResponse"
        "403":
          description: Insufficient permissions
        "404":
          description: Not found
  /deal-card/{id}/submission/{section}:
    patch:
      operationId: patchDealSection
      tags: [deal-card]
      summary: Edit one submission section (role + field validation enforced)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: section
          in: path
          required: true
          schema:
            type: string
            enum: [business, locations, workforce, operations, loss, coverage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionPatchRequest"
      responses:
        "200":
          description: Updated section payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionPatchResponse"
        "400":
          description: Validation error
        "403":
          description: Insufficient permissions
        "404":
          description: Not found
  /deal-card/{id}/activity:
    get:
      operationId: getDealCardActivity
      tags: [deal-card]
      summary: Role-filtered collaboration feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedResponse"
  /deal-card/{id}/messages:
    post:
      operationId: postDealCardMessage
      tags: [deal-card]
      summary: Persist a composer message to the activity feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Message persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Insufficient permissions
  /deal-card/{id}/approve:
    post:
      operationId: approveDeal
      tags: [deal-card]
      summary: Approve the submission (UNDERWRITER / ADMIN only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageActionResponse"
        "403":
          description: Insufficient permissions
        "409":
          description: Blocked by one or more open blocking RFIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveBlockedResponse"
  /deal-card/{id}/decline:
    post:
      operationId: declineDeal
      tags: [deal-card]
      summary: Decline the submission (UNDERWRITER / ADMIN only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineRequest"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageActionResponse"
        "403":
          description: Insufficient permissions
  /deal-card/{id}/rfis:
    get:
      operationId: getDealCardRfis
      tags: [deal-card]
      summary: Role-filtered RFI list with open-blocking count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: RFI list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfiListResponse"
        "403":
          description: Insufficient permissions
    post:
      operationId: createDealCardRfi
      tags: [deal-card]
      summary: Raise an RFI (internal staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRfiRequest"
      responses:
        "200":
          description: RFI created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfiMutationResponse"
        "403":
          description: Insufficient permissions
  /deal-card/{id}/rfis/{rfiId}/resolve:
    post:
      operationId: resolveDealCardRfi
      tags: [deal-card]
      summary: Resolve or waive an RFI (internal staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: rfiId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRfiRequest"
      responses:
        "200":
          description: RFI resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfiMutationResponse"
        "403":
          description: Insufficient permissions
        "409":
          description: RFI already closed
  /deal-card/{id}/clear-rating-stale:
    post:
      operationId: clearRatingStale
      tags: [deal-card]
      summary: Clear the rating-stale flag after a successful re-rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingStaleClearedResponse"
  /deal-card/{id}/quote-variations:
    get:
      operationId: getQuoteVariations
      tags: [deal-card]
      summary: AI-proposed alternative pricing scenarios for a deal's quote (internal only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote variations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteVariationsResponse"
        "403":
          description: Insufficient permissions
  /deal-card/{id}/quote-variations/apply:
    post:
      operationId: applyQuoteVariation
      tags: [deal-card]
      summary: Promote a quote variation into the deal's saved quote (internal only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyVariationRequest"
      responses:
        "200":
          description: Variation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyVariationResponse"
        "403":
          description: Insufficient permissions
        "409":
          description: Deal has no quote to vary
  /deal-card/{id}/quote-variations/preview:
    post:
      operationId: previewQuoteVariation
      tags: [deal-card]
      summary: Re-rate arbitrary levers without persisting (what-if panel, internal only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewVariationRequest"
      responses:
        "200":
          description: Re-rated premium for the supplied levers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewVariationResponse"
        "403":
          description: Insufficient permissions
        "409":
          description: Deal has no quote to vary
components:
  schemas:
    SubmissionField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, date, boolean, array]
        value:
          nullable: true
        required:
          type: boolean
        ratingRelevant:
          type: boolean
        readOnly:
          type: boolean
      required: [key, label, type, required, ratingRelevant, readOnly]
    SubmissionSection:
      type: object
      properties:
        key:
          type: string
          enum: [business, locations, workforce, operations, loss, coverage]
        label:
          type: string
        icon:
          type: string
        status:
          type: string
          enum: [complete, partial, not_started]
        missing:
          type: integer
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionField"
      required: [key, label, icon, status, missing, fields]
    DealSubmissionResponse:
      type: object
      properties:
        deal:
          type: object
          additionalProperties: true
        account:
          type: object
          nullable: true
          additionalProperties: true
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionSection"
        aggregateComplete:
          type: integer
        total:
          type: integer
        access:
          type: object
          additionalProperties:
            type: boolean
        canApprove:
          type: boolean
      required: [deal, sections, aggregateComplete, total, access, canApprove]
    SectionPatchRequest:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: true
      required: [fields]
    SectionDiff:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
        from:
          nullable: true
        to:
          nullable: true
      required: [field, label]
    SectionPatchResponse:
      type: object
      properties:
        success:
          type: boolean
        changed:
          type: boolean
        ratingStale:
          type: boolean
          nullable: true
        diffs:
          type: array
          items:
            $ref: "#/components/schemas/SectionDiff"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionSection"
        aggregateComplete:
          type: integer
        total:
          type: integer
        deal:
          type: object
          additionalProperties: true
      required: [success]
    ActivityEntry:
      type: object
      properties:
        id:
          type: string
        dealId:
          type: string
          nullable: true
        entityType:
          type: string
        entityId:
          type: string
        eventType:
          type: string
        description:
          type: string
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
      required: [id, entityType, entityId, eventType, description]
    ActivityFeedResponse:
      type: object
      properties:
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
      required: [activity]
    MessageRequest:
      type: object
      properties:
        message:
          type: string
        internal:
          type: boolean
      required: [message]
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        entry:
          $ref: "#/components/schemas/ActivityEntry"
      required: [success, entry]
    DeclineRequest:
      type: object
      properties:
        reason:
          type: string
      required: [reason]
    StageActionResponse:
      type: object
      properties:
        success:
          type: boolean
        stage:
          type: string
      required: [success, stage]
    ApproveBlockedResponse:
      type: object
      properties:
        error:
          type: string
        blockingRfis:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              subject:
                type: string
            required: [id, subject]
      required: [error, blockingRfis]
    RatingStaleClearedResponse:
      type: object
      properties:
        success:
          type: boolean
        ratingStale:
          type: boolean
      required: [success, ratingStale]
    Rfi:
      type: object
      properties:
        id:
          type: string
        dealId:
          type: string
        subject:
          type: string
        detail:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, RESOLVED, WAIVED]
        blocking:
          type: boolean
        internal:
          type: boolean
        dueAt:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdByName:
          type: string
          nullable: true
        resolvedAt:
          type: string
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        resolvedByName:
