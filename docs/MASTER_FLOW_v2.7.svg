/text><text x="870.0" y="998" fill="#A8A8B2" font-size="12.5" text-anchor="middle">Listener email · replies thread in</text><line x1="1020" y1="978" x2="1060" y2="978" stroke="#8A8A93" stroke-width="1.6" marker-end="url(#a)"/><rect x="1060" y="952" width="280" height="52" rx="10" fill="#2A2612" stroke="#EAB308" stroke-width="1.2"/><text x="1200.0" y="978" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">Binder OR policy</text><text x="1200.0" y="998" fill="#A8A8B2" font-size="12.5" text-anchor="middle">Confirms bound · rep uploads</text><line x1="1200" y1="1004" x2="1200" y2="1030" stroke="#8A8A93" stroke-width="1.6" marker-end="url(#a)"/><rect x="1060" y="1034" width="280" height="50" rx="10" fill="#0E3D34" stroke="#14B8A6" stroke-width="1.2"/><text x="1200.0" y="1060" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">Bound (Stage 6)</text><text x="1200.0" y="1080" fill="#A8A8B2" font-size="12.5" text-anchor="middle">New Client · tracker fires</text><text x="60" y="1108" fill="#EAB308" font-size="12.5">Parallel · non-gating: broker fee dunning (client + agent, pay link) · deposit 30-day monitor</text><text x="60" y="1144" fill="#7C3AED" font-size="15" font-weight="bold">5 · IMPLEMENTATION → ACTIVE CLIENT</text><line x1="60" y1="1154" x2="1340" y2="1154" stroke="#2A2A33" stroke-width="1"/><rect x="560" y="1166" width="280" height="50" rx="10" fill="#0E3D34" stroke="#14B8A6" stroke-width="1.2"/><text x="700.0" y="1196.0" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">Bound → tracker by product type</text><line x1="640" y1="1216" x2="360" y2="1250" stroke="#8A8A93" stroke-width="1.6" marker-end="url(#a)"/><line x1="760" y1="1216" x2="1040" y2="1250" stroke="#8A8A93" stroke-width="1.6" marker-end="url(#a)"/><rect x="120" y="1254" width="520" height="300" rx="10" fill="#241C3A" stroke="#7C3AED" stroke-width="1.2"/><text x="380.0" y="1409.0" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle"></text><text x="380" y="1284" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">WC tracker — 4 phases</text><text x="150" y="1320" fill="#C8C8D0" font-size="13">1 · Carrier acceptance — auto on upload</text><text x="150" y="1360" fill="#C8C8D0" font-size="13">2 · Policy issuance — 24h–7d, day-5 nudge</text><text x="150" y="1400" fill="#C8C8D0" font-size="13">3 · Policy + claims kit delivery</text><text x="150" y="1440" fill="#C8C8D0" font-size="13">4 · Carrier billing setup</text><text x="150" y="1500" fill="#8A8A93" font-size="12">Direct policy completes phases 1+2 together</text><rect x="760" y="1254" width="520" height="300" rx="10" fill="#241C3A" stroke="#7C3AED" stroke-width="1.2"/><text x="1020.0" y="1409.0" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle"></text><text x="1020" y="1284" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">PEO tracker — 5 phases</text><text x="790" y="1318" fill="#C8C8D0" font-size="13">1 · CSA-PEO executed (auto)</text><text x="790" y="1356" fill="#C8C8D0" font-size="13">2 · Implementation meeting (Calendly)</text><text x="790" y="1394" fill="#C8C8D0" font-size="13">3 · Employee onboarding — N of M</text><text x="790" y="1432" fill="#C8C8D0" font-size="13">4 · Payroll setup — start = sign + 14d</text><text x="790" y="1470" fill="#C8C8D0" font-size="13">5 · Go-live — gates on 3 &amp; 4</text><text x="790" y="1512" fill="#8A8A93" font-size="12">WC deliverables ride as sub-items</text><line x1="380" y1="1554" x2="640" y2="1600" stroke="#8A8A93" stroke-width="1.6" marker-end="url(#a)"/><line x1="1020" y1="1554" x2="760" y2="1600" stroke="#8A8A93" stroke-width="1.6" marker-end="url(#a)"/><rect x="500" y="1604" width="400" height="52" rx="10" fill="#0E3D34" stroke="#14B8A6" stroke-width="1.2"/><text x="700.0" y="1630" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">All phases complete → Active Client</text><text x="700.0" y="1650" fill="#A8A8B2" font-